name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Run v0.1 release gate
        shell: pwsh
        run: ./tools/Test-V01ReleaseGate.ps1

      - name: Run v0.2 state store and IPC gate
        shell: pwsh
        run: ./tools/Test-V02StateStoreIpc.ps1 -Configuration Release -SkipBuild

      - name: Run v0.2 live Dashboard pages implementation gate
        shell: pwsh
        run: ./tools/Test-V02LivePages.ps1 -Configuration Release -SkipBuild

      - name: Run v0.2 live Widgets implementation gate
        shell: pwsh
        run: ./tools/Test-V02LiveWidgets.ps1 -Configuration Release -SkipBuild

      - name: Run v0.2 Thai and English language-mode gate
        shell: pwsh
        run: ./tools/Test-V02LanguageModes.ps1 -Configuration Release -SkipBuild

      - name: Run v0.4 CLI self-report implementation gate
        shell: pwsh
        run: ./tools/Test-V04SelfReportCli.ps1 -Configuration Release -SkipBuild

      - name: Run v0.4 assignment lifecycle implementation gate
        shell: pwsh
        run: ./tools/Test-V04AssignmentLifecycle.ps1 -Configuration Release -SkipBuild

      - name: Run v0.4 Delegation Graph implementation gate
        shell: pwsh
        run: ./tools/Test-V04DelegationGraph.ps1 -Configuration Release -SkipBuild

      - name: Run v0.4 Task Alignment implementation gate
        shell: pwsh
        run: ./tools/Test-V04TaskAlignment.ps1 -Configuration Release -SkipBuild

      - name: Run v0.4 Expanded Widget implementation gate
        shell: pwsh
        run: ./tools/Test-V04ExpandedWidget.ps1 -Configuration Release -SkipBuild

      - name: Run v0.5 compliance rule engine implementation gate
        shell: pwsh
        run: ./tools/Test-V05ComplianceRuleEngine.ps1 -Configuration Release -SkipBuild

      - name: Run v0.5 evidence and audit storage implementation gate
        shell: pwsh
        run: ./tools/Test-V05EvidenceAuditStorage.ps1 -Configuration Release -SkipBuild

      - name: Run v0.5 Compliance Queue implementation gate
        shell: pwsh
        run: ./tools/Test-V05ComplianceQueue.ps1 -Configuration Release -SkipBuild

      - name: Run v0.6 explainable scoring engine gate
        shell: pwsh
        run: ./tools/Test-V06ScoringEngine.ps1 -Configuration Release -SkipBuild

      - name: Run v0.5 role-distinct review implementation gate
        shell: pwsh
        run: ./tools/Test-V05RoleDistinctReview.ps1 -Configuration Release -SkipBuild

      - name: Run v1 install acceptance static and synthetic gate (Windows PowerShell)
        shell: powershell
        run: ./tools/acceptance/Test-HerdrOpsInstallAcceptance.ps1

      - name: Run v1 install acceptance static and synthetic gate (PowerShell 7)
        shell: pwsh
        run: ./tools/acceptance/Test-HerdrOpsInstallAcceptance.ps1

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results
          path: artifacts/test-results
          if-no-files-found: ignore

      - name: Upload design evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: design-evidence
          path: artifacts/design-evidence
          if-no-files-found: warn

      - name: Upload performance evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: performance-evidence
          path: artifacts/performance-evidence
          if-no-files-found: warn

      - name: Upload v0.1 gate report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: v0.1-gate-report
          path: artifacts/release-gates/v0.1.0
          if-no-files-found: warn

      - name: Upload v0.2 state store and IPC gate report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: v0.2-state-store-ipc-gate-report
          path: artifacts/release-gates/v0.2.0/issue-8
          if-no-files-found: warn

      - name: Upload v0.2 live Dashboard pages gate report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: v0.2-live-dashboard-pages-gate-report
          path: artifacts/release-gates/v0.2.0/issue-9
          if-no-files-found: warn

      - name: Upload v0.2 live Widgets gate report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: v0.2-live-widgets-gate-report
          path: artifacts/release-gates/v0.2.0/issue-10
          if-no-files-found: warn

      - name: Upload v0.2 language-mode gate report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: v0.2-language-mode-gate-report
          path: artifacts/release-gates/v0.2.0/issue-63
          if-no-files-found: warn

      - name: Upload v0.4 Delegation Graph gate report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: v0.4-delegation-graph-gate-report
          path: artifacts/release-gates/v0.4.0/issue-20
          if-no-files-found: warn

      - name: Upload v0.4 CLI self-report gate report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: v0.4-cli-self-report-gate-report
          path: artifacts/release-gates/v0.4.0/issue-18
          if-no-files-found: warn

      - name: Upload v0.4 assignment lifecycle gate report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: v0.4-assignment-lifecycle-gate-report
          path: artifacts/release-gates/v0.4.0/issue-19
          if-no-files-found: warn

      - name: Upload v0.4 Task Alignment gate report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: v0.4-task-alignment-gate-report
          path: artifacts/release-gates/v0.4.0/issue-21
          if-no-files-found: warn

      - name: Upload v0.4 Expanded Widget gate report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: v0.4-expanded-widget-gate-report
          path: artifacts/release-gates/v0.4.0/issue-22
          if-no-files-found: warn

      - name: Upload v0.5 compliance rule engine gate report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: v0.5-compliance-rule-engine-gate-report
          path: artifacts/release-gates/v0.5.0/issue-24
          if-no-files-found: warn

      - name: Upload v0.5 evidence and audit storage gate report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: v0.5-evidence-audit-storage-gate-report
          path: artifacts/release-gates/v0.5.0/issue-25
          if-no-files-found: warn

      - name: Upload v0.5 Compliance Queue gate report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: v0.5-compliance-queue-gate-report
          path: artifacts/release-gates/v0.5.0/issue-26
          if-no-files-found: warn

      - name: Upload v0.6 explainable scoring engine gate report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: v0.6-explainable-scoring-engine-gate-report
          path: artifacts/release-gates/v0.6.0/issue-30

      - name: Upload v0.5 role-distinct review gate report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: v0.5-role-distinct-review-gate-report
          path: artifacts/release-gates/v0.5.0/issue-27
          if-no-files-found: warn
