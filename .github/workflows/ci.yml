name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Run v0.1 release gate
        shell: pwsh
        run: ./tools/Test-V01ReleaseGate.ps1

      - name: Run v0.2 state store and IPC gate
        shell: pwsh
        run: ./tools/Test-V02StateStoreIpc.ps1 -Configuration Release -SkipBuild

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results
          path: artifacts/test-results
          if-no-files-found: ignore

      - name: Upload design evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: design-evidence
          path: artifacts/design-evidence
          if-no-files-found: warn

      - name: Upload v0.1 gate report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: v0.1-gate-report
          path: artifacts/release-gates/v0.1.0
          if-no-files-found: warn

      - name: Upload v0.2 state store and IPC gate report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: v0.2-state-store-ipc-gate-report
          path: artifacts/release-gates/v0.2.0/issue-8
          if-no-files-found: warn
