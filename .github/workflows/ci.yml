name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      HERDOPS_V02_LIVE_WIDGET_RUN_TOKEN: ${{ github.run_id }}-${{ github.run_attempt }}
      ISSUE43_EVENT_NAME: ${{ github.event_name }}
      ISSUE43_CANDIDATE_SHA: ${{ github.sha }}
      ISSUE43_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      ISSUE43_PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      ISSUE43_REVIEW_BRANCH: ${{ github.head_ref || github.ref_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # Test-V07Issue37ManifestIntegrity.ps1 reads blob bytes from the pinned candidate commit 4d36e288 (an origin/main ancestor); no branch-local commits are referenced

      - name: Run v0.7 Issue #37 manifest integrity self-test (deterministic, no blobs required)
        shell: pwsh
        run: ./tools/Test-V07Issue37ManifestIntegrity.ps1 -SelfTest

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Run solution test scheduling regression (Issue #135)
        shell: pwsh
        run: ./tools/Test-BuildTestScheduling.ps1

      # Static/Synthetic only; Actual Herdr Runtime NOT OBSERVED.
      - name: 'Run v0.7 packaging gate (Issue #38) - Static/Synthetic - PowerShell 7 (pwsh)'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $reportRoot = 'artifacts/release-gates/v0.7.0/issue-38'
          try {
            New-Item -ItemType Directory -Path $reportRoot -Force | Out-Null
            $reports = @(./tools/packaging/Test-HerdrOpsPackaging.ps1)
            if ($reports.Count -ne 1) {
              throw "Packaging gate (PowerShell 7) returned $($reports.Count) objects; expected exactly 1."
            }
            $report = $reports[0]
            if ([string]$report.EvidenceClass -cne 'Static/Synthetic') {
              throw 'Packaging gate (PowerShell 7) did not return a Static/Synthetic PASS report.'
            }
            foreach ($boundary in @('CleanMachine', 'Runtime', 'Human', 'Release')) {
              if ([string]$report.$boundary -cne 'NOT OBSERVED') {
                throw "Packaging gate (PowerShell 7) boundary '$boundary' was not NOT OBSERVED."
              }
            }
            $report | Format-List | Out-String | Set-Content -LiteralPath (Join-Path $reportRoot 'pwsh-report.txt') -Encoding utf8
          } catch {
            $originalError = $_
            try {
              New-Item -ItemType Directory -Path $reportRoot -Force | Out-Null
              $diagPath = Join-Path $reportRoot 'pwsh-failure.txt'
              @(
                "FAILURE: Packaging gate (PowerShell 7) did not complete successfully."
                "EvidenceClass: Static/Synthetic"
                "Shell: pwsh"
                "ExitTime: $(Get-Date -Format 'o')"
                "Error: $($originalError.Exception.Message)"
                "ScriptStackTrace: $($originalError.ScriptStackTrace)"
              ) | Set-Content -LiteralPath $diagPath -Encoding utf8
            } catch {
              Write-Warning "Could not write packaging gate diagnostics: $($_.Exception.Message)"
            }
            throw $originalError
          }

      # Static/Synthetic only; Actual Herdr Runtime NOT OBSERVED.
      - name: 'Run v0.7 packaging gate (Issue #38) - Static/Synthetic - Windows PowerShell 5.1'
        if: always()
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $reportRoot = 'artifacts\release-gates\v0.7.0\issue-38'
          try {
            New-Item -ItemType Directory -Path $reportRoot -Force | Out-Null
            $reports = @(& .\tools\packaging\Test-HerdrOpsPackaging.ps1)
            if ($reports.Count -ne 1) {
              throw "Packaging gate (Windows PowerShell 5.1) returned $($reports.Count) objects; expected exactly 1."
            }
            $report = $reports[0]
            if ([string]$report.EvidenceClass -cne 'Static/Synthetic') {
              throw 'Packaging gate (Windows PowerShell 5.1) did not return a Static/Synthetic PASS report.'
            }
            foreach ($boundary in @('CleanMachine', 'Runtime', 'Human', 'Release')) {
              if ([string]$report.$boundary -cne 'NOT OBSERVED') {
                throw "Packaging gate (Windows PowerShell 5.1) boundary '$boundary' was not NOT OBSERVED."
              }
            }
            $report | Format-List | Out-String | Set-Content -LiteralPath (Join-Path $reportRoot 'powershell-5.1-report.txt') -Encoding UTF8
          } catch {
            $originalError = $_
            try {
              New-Item -ItemType Directory -Path $reportRoot -Force | Out-Null
              $diagPath = Join-Path $reportRoot 'powershell-5.1-failure.txt'
              @(
                "FAILURE: Packaging gate (Windows PowerShell 5.1) did not complete successfully."
                "EvidenceClass: Static/Synthetic"
                "Shell: powershell (5.1)"
                "ExitTime: $(Get-Date -Format 'o')"
                "Error: $($originalError.Exception.Message)"
                "ScriptStackTrace: $($originalError.ScriptStackTrace)"
              ) | Set-Content -LiteralPath $diagPath -Encoding UTF8
            } catch {
              Write-Warning "Could not write packaging gate diagnostics: $($_.Exception.Message)"
            }
            throw $originalError
          }

      - name: 'Upload v0.7 packaging gate report (Issue #38)'
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          retention-days: 7
          name: v0.7-packaging-gate-report
          path: artifacts/release-gates/v0.7.0/issue-38
          if-no-files-found: warn

      - name: Run v0.1 release gate
        shell: pwsh
        run: ./tools/Test-V01ReleaseGate.ps1

      - name: Run v0.2 state store and IPC gate
        shell: pwsh
        run: ./tools/Test-V02StateStoreIpc.ps1 -Configuration Release -SkipBuild

      - name: Run v0.2 live Dashboard pages implementation gate
        shell: pwsh
        run: ./tools/Test-V02LivePages.ps1 -Configuration Release -SkipBuild

      - name: Run v0.2 live widgets provenance tests (PowerShell 7)
        shell: pwsh
        run: ./tools/Test-V02LiveWidgetsProvenance.Tests.ps1

      - name: Run v0.2 live widgets provenance tests (Windows PowerShell 5.1)
        shell: powershell
        run: ./tools/Test-V02LiveWidgetsProvenance.Tests.ps1

      - name: Run v0.2 live Widgets implementation gate
        shell: pwsh
        run: ./tools/Test-V02LiveWidgets.ps1 -Configuration Release -SkipBuild -RunToken $env:HERDOPS_V02_LIVE_WIDGET_RUN_TOKEN

      - name: Run v0.2 Thai and English language-mode gate
        shell: pwsh
        run: ./tools/Test-V02LanguageModes.ps1 -Configuration Release -SkipBuild

      - name: Run v0.3 implementation aggregation tests
        shell: pwsh
        run: ./tools/Test-V03ImplementationGateTests.ps1

      # Static/Synthetic provenance regressions only; no live capture or Actual Herdr Runtime credit.
      - name: Run v0.3 runtime-capture provenance hostile selftests (PowerShell 7)
        shell: pwsh
        run: ./tools/Test-V03RuntimeCaptureProvenanceTests.ps1

      - name: Run v0.3 runtime-capture provenance hostile selftests (Windows PowerShell 5.1)
        shell: powershell
        run: ./tools/Test-V03RuntimeCaptureProvenanceTests.ps1

      - name: Run v0.3 Implementation Contract Synthetic gate
        shell: pwsh
        run: ./tools/Test-V03ImplementationGate.ps1 -Configuration Release -SkipBuild

      # Static/Synthetic verifier selftests against temporary mock fixtures only; does NOT validate real committed review records in docs/reviews/. Real canonical review binding is enforced in tools/Test-V04ReleaseGate.ps1 only.
      - name: Run v0.4 review-binding verifier tests (PowerShell 7)
        shell: pwsh
        run: ./tools/Test-V04ReviewBinding.ps1

      - name: Run v0.4 review-binding verifier tests (Windows PowerShell 5.1)
        shell: powershell
        run: ./tools/Test-V04ReviewBinding.ps1

      - name: Run v0.4 CLI self-report implementation gate
        shell: pwsh
        run: ./tools/Test-V04SelfReportCli.ps1 -Configuration Release -SkipBuild

      - name: Run v0.4 assignment lifecycle implementation gate
        shell: pwsh
        run: ./tools/Test-V04AssignmentLifecycle.ps1 -Configuration Release -SkipBuild

      - name: Run v0.4 Delegation Graph implementation gate
        shell: pwsh
        run: ./tools/Test-V04DelegationGraph.ps1 -Configuration Release -SkipBuild

      - name: Run v0.4 Task Alignment implementation gate
        shell: pwsh
        run: ./tools/Test-V04TaskAlignment.ps1 -Configuration Release -SkipBuild

      - name: Run v0.4 Expanded Widget implementation gate
        shell: pwsh
        run: ./tools/Test-V04ExpandedWidget.ps1 -Configuration Release -SkipBuild

      - name: Run v0.5 compliance rule engine implementation gate
        shell: pwsh
        run: ./tools/Test-V05ComplianceRuleEngine.ps1 -Configuration Release -SkipBuild

      - name: Run v0.5 evidence and audit storage implementation gate
        shell: pwsh
        run: ./tools/Test-V05EvidenceAuditStorage.ps1 -Configuration Release -SkipBuild

      - name: Run v0.5 evidence/audit forward-extension hostile self-tests (PowerShell 7)
        shell: pwsh
        run: ./tools/Test-V05EvidenceAuditStorage.ps1 -SelfTest

      - name: Run v0.5 evidence/audit forward-extension hostile self-tests (Windows PowerShell 5.1)
        shell: powershell
        run: ./tools/Test-V05EvidenceAuditStorage.ps1 -SelfTest

      # Static/Synthetic/Contract/local SQLite integration only; Actual Herdr Runtime and Release NOT OBSERVED.
      - name: Prepare v1.0 Issue #43 CI candidate binding
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          function Resolve-Issue43Commit {
            param(
              [Parameter(Mandatory)]
              [string]$Value,

              [Parameter(Mandatory)]
              [string]$Name
            )

            $normalized = $Value.Trim().ToLowerInvariant()
            if ($normalized -notmatch '^[0-9a-f]{40}$') {
              throw "Issue #43 CI binding '$Name' must be an exact 40-hex SHA."
            }

            $resolvedOutput = @(& git rev-parse --verify ($normalized + '^{commit}') 2>&1)
            if ($LASTEXITCODE -ne 0 -or $resolvedOutput.Count -ne 1) {
              throw "Issue #43 CI binding '$Name' could not be resolved."
            }

            $resolved = ($resolvedOutput -join '').Trim().ToLowerInvariant()
            if ($resolved -cne $normalized) {
              throw "Issue #43 CI binding '$Name' resolved to an unexpected commit."
            }
            return $resolved
          }

          $candidate = Resolve-Issue43Commit -Value $env:ISSUE43_CANDIDATE_SHA -Name 'candidate'
          $sourceOutput = @(& git rev-parse --verify 'HEAD^{commit}' 2>&1)
          if ($LASTEXITCODE -ne 0 -or $sourceOutput.Count -ne 1) {
            throw 'Issue #43 CI binding could not resolve the checked-out HEAD.'
          }
          $source = ($sourceOutput -join '').Trim().ToLowerInvariant()
          if ($source -cne $candidate) {
            throw "Issue #43 CI candidate $candidate does not match checked-out HEAD $source."
          }

          $reviewBranch = ([string]$env:ISSUE43_REVIEW_BRANCH).Trim()
          if ([string]::IsNullOrWhiteSpace($reviewBranch)) {
            throw 'Issue #43 CI binding received no reviewed branch.'
          }
          & git check-ref-format --branch $reviewBranch *> $null
          if ($LASTEXITCODE -ne 0) {
            throw "Issue #43 CI binding received an invalid branch name: $reviewBranch"
          }

          $parentOutput = @(& git rev-list --parents -n 1 $source 2>&1)
          if ($LASTEXITCODE -ne 0 -or $parentOutput.Count -ne 1) {
            throw 'Issue #43 CI binding could not resolve candidate parents.'
          }
          $parentTokens = (($parentOutput -join '').Trim() -split '\s+')
          if ($parentTokens[0].ToLowerInvariant() -cne $candidate -or $parentTokens.Count -lt 2) {
            throw 'Issue #43 CI binding received malformed candidate parent data.'
          }

          $eventName = ([string]$env:ISSUE43_EVENT_NAME).Trim()
          if ($eventName -ceq 'pull_request') {
            $expectedHead = Resolve-Issue43Commit -Value $env:ISSUE43_PR_HEAD_SHA -Name 'pull-request head'
            $expectedBase = Resolve-Issue43Commit -Value $env:ISSUE43_PR_BASE_SHA -Name 'pull-request base'
            if ($parentTokens.Count -ne 3 -or
                $parentTokens[1].ToLowerInvariant() -cne $expectedBase -or
                $parentTokens[2].ToLowerInvariant() -cne $expectedHead) {
              throw 'Issue #43 CI pull-request merge commit is not bound to the declared base and head.'
            }
            $directParent = $expectedBase
          } elseif ($eventName -ceq 'push') {
            if ($reviewBranch -cne 'main') {
              throw "Issue #43 CI push binding expected main, observed $reviewBranch."
            }
            $directParent = $parentTokens[1].ToLowerInvariant()
          } else {
            throw "Issue #43 CI binding does not support event '$eventName'."
          }

          $initialStatus = @(& git status --porcelain=v1 --untracked-files=all 2>&1)
          if ($LASTEXITCODE -ne 0 -or $initialStatus.Count -ne 0) {
            throw 'Issue #43 CI binding requires a clean checkout before branch binding.'
          }

          $branchOutput = @(& git symbolic-ref --short HEAD 2>&1)
          $branchExit = $LASTEXITCODE
          $observedBranch = ($branchOutput -join '').Trim()
          if ($branchExit -eq 0 -and -not [string]::IsNullOrWhiteSpace($observedBranch)) {
            if (-not [string]::Equals($observedBranch, $reviewBranch, [StringComparison]::Ordinal)) {
              throw "Issue #43 CI observed branch '$observedBranch', expected '$reviewBranch'."
            }
          } else {
            & git switch --create $reviewBranch $candidate
            if ($LASTEXITCODE -ne 0) {
              throw "Issue #43 CI could not bind detached HEAD to branch '$reviewBranch'."
            }
          }

          $finalBranch = ((@(& git symbolic-ref --short HEAD 2>&1) -join '').Trim())
          if (-not [string]::Equals($finalBranch, $reviewBranch, [StringComparison]::Ordinal)) {
            throw "Issue #43 CI branch binding ended at '$finalBranch', expected '$reviewBranch'."
          }
          $finalStatus = @(& git status --porcelain=v1 --untracked-files=all 2>&1)
          if ($LASTEXITCODE -ne 0 -or $finalStatus.Count -ne 0) {
            throw 'Issue #43 CI branch binding changed the checkout state.'
          }

          if ([string]::IsNullOrWhiteSpace($env:GITHUB_ENV)) {
            throw 'Issue #43 CI binding cannot publish its exact values to subsequent steps.'
          }
          $environmentLines = @(
            "ISSUE43_CANDIDATE_COMMIT=$candidate"
            "ISSUE43_DIRECT_PARENT_COMMIT=$directParent"
            "ISSUE43_REVIEW_BRANCH=$reviewBranch"
          )
          [IO.File]::AppendAllText(
            $env:GITHUB_ENV,
            (($environmentLines -join [Environment]::NewLine) + [Environment]::NewLine),
            [Text.UTF8Encoding]::new($false))
          Write-Host "Issue #43 CI binding prepared: candidate=$candidate; direct-parent=$directParent; branch=$reviewBranch; event=$eventName"

      - name: Run v1.0 Issue #43 security-review fixtures (PowerShell 7)
        if: always()
        shell: pwsh
        run: ./tools/Test-V10Issue43SecurityReviewFixtures.ps1

      - name: Run v1.0 Issue #43 security-review fixtures (Windows PowerShell 5.1)
        if: always()
        shell: powershell
        run: ./tools/Test-V10Issue43SecurityReviewFixtures.ps1

      # Static/Synthetic/Contract/local SQLite integration only; Actual Herdr Runtime and Release NOT OBSERVED.
      - name: Run v1.0 Issue #43 security/privacy preparation gate (PowerShell 7)
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $reportRoot = 'artifacts/release-gates/v1.0.0/issue-43'
          $candidate = [string]$env:ISSUE43_CANDIDATE_COMMIT
          $directParent = [string]$env:ISSUE43_DIRECT_PARENT_COMMIT
          $branch = [string]$env:ISSUE43_REVIEW_BRANCH
          try {
            if ([string]::IsNullOrWhiteSpace($candidate) -or
                [string]::IsNullOrWhiteSpace($directParent) -or
                [string]::IsNullOrWhiteSpace($branch)) {
              throw 'Issue #43 CI binding values were not published by the preparation step.'
            }
            New-Item -ItemType Directory -Path $reportRoot -Force | Out-Null
            & ./tools/Test-V10Issue43SecurityReview.ps1 `
              -Configuration Release `
              -CandidateCommit $candidate `
              -DirectParentCommit $directParent `
              -Branch $branch
            if ($LASTEXITCODE -ne 0) {
              throw "Issue #43 preparation gate exited with code $LASTEXITCODE."
            }
          } catch {
            $originalError = $_
            try {
              New-Item -ItemType Directory -Path $reportRoot -Force | Out-Null
              @(
                'FAILURE: Issue #43 preparation gate did not complete successfully.'
                "CandidateCommit: $candidate"
                "DirectParentCommit: $directParent"
                "Branch: $branch"
                'EvidenceClass: Static/Synthetic/Contract/LocalSQLiteIntegration'
                'Runtime: NOT OBSERVED / NOT CLAIMED'
                'Release: NOT OBSERVED / NOT CLAIMED'
                "Error: $($originalError.Exception.Message)"
                "ScriptStackTrace: $($originalError.ScriptStackTrace)"
              ) | Set-Content -LiteralPath (Join-Path $reportRoot 'ci-pwsh-failure.txt') -Encoding utf8
            } catch {
              Write-Warning "Could not write Issue #43 diagnostics: $($_.Exception.Message)"
            }
            throw $originalError
          }

      - name: Run v1.0 Issue #43 security/privacy preparation gate (Windows PowerShell 5.1)
        if: always()
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $reportRoot = 'artifacts\release-gates\v1.0.0\issue-43'
          $candidate = [string]$env:ISSUE43_CANDIDATE_COMMIT
          $directParent = [string]$env:ISSUE43_DIRECT_PARENT_COMMIT
          $branch = [string]$env:ISSUE43_REVIEW_BRANCH
          try {
            if ([string]::IsNullOrWhiteSpace($candidate) -or
                [string]::IsNullOrWhiteSpace($directParent) -or
                [string]::IsNullOrWhiteSpace($branch)) {
              throw 'Issue #43 CI binding values were not published by the preparation step.'
            }
            New-Item -ItemType Directory -Path $reportRoot -Force | Out-Null
            & .\tools\Test-V10Issue43SecurityReview.ps1 `
              -Configuration Release `
              -CandidateCommit $candidate `
              -DirectParentCommit $directParent `
              -Branch $branch
            if ($LASTEXITCODE -ne 0) {
              throw "Issue #43 preparation gate exited with code $LASTEXITCODE."
            }
          } catch {
            $originalError = $_
            try {
              New-Item -ItemType Directory -Path $reportRoot -Force | Out-Null
              @(
                'FAILURE: Issue #43 preparation gate did not complete successfully.'
                "CandidateCommit: $candidate"
                "DirectParentCommit: $directParent"
                "Branch: $branch"
                'EvidenceClass: Static/Synthetic/Contract/LocalSQLiteIntegration'
                'Runtime: NOT OBSERVED / NOT CLAIMED'
                'Release: NOT OBSERVED / NOT CLAIMED'
                "Error: $($originalError.Exception.Message)"
                "ScriptStackTrace: $($originalError.ScriptStackTrace)"
              ) | Set-Content -LiteralPath (Join-Path $reportRoot 'ci-powershell-5.1-failure.txt') -Encoding UTF8
            } catch {
              Write-Warning "Could not write Issue #43 diagnostics: $($_.Exception.Message)"
            }
            throw $originalError
          }

      - name: Upload v1.0 Issue #43 security/privacy preparation reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          retention-days: 7
          name: v1.0-issue-43-security-privacy-gate-report
          path: artifacts/release-gates/v1.0.0/issue-43
          if-no-files-found: error

      - name: Run v0.5 Compliance Queue implementation gate
        shell: pwsh
        run: ./tools/Test-V05ComplianceQueue.ps1 -Configuration Release -SkipBuild

      - name: Run v0.6 explainable scoring engine gate
        shell: pwsh
        run: ./tools/Test-V06ScoringEngine.ps1 -Configuration Release -SkipBuild

      - name: Run v0.5 role-distinct review implementation gate
        shell: pwsh
        run: ./tools/Test-V05RoleDistinctReview.ps1 -Configuration Release -SkipBuild

      - name: Run v0.7 lifecycle implementation gate deterministic self-test (pwsh)
        shell: pwsh
        run: ./tools/Test-V07Lifecycle.ps1 -SelfTest

      - name: Run v0.7 lifecycle implementation gate deterministic self-test (Windows PowerShell 5.1)
        shell: powershell
        run: ./tools/Test-V07Lifecycle.ps1 -SelfTest

      # Static/Synthetic policy regressions only; no live soak or Actual Herdr Runtime credit.
      - name: Run v0.7 performance budget policy tests (PowerShell 7)
        shell: pwsh
        run: ./tools/Test-V07PerformanceBudgets.Tests.ps1

      - name: Run v0.7 performance budget policy tests (Windows PowerShell 5.1)
        shell: powershell
        run: ./tools/Test-V07PerformanceBudgets.Tests.ps1

      # Static/Synthetic producer unit & regression tests; no live soak or Actual Herdr Runtime credit.
      - name: Run v0.7 performance measurement producer tests (PowerShell 7)
        shell: pwsh
        run: ./tools/Test-V07PerformanceMeasurement.Tests.ps1

      - name: Run v0.7 performance measurement producer tests (Windows PowerShell 5.1)
        shell: powershell
        run: ./tools/Test-V07PerformanceMeasurement.Tests.ps1

      # Issue #44 install-acceptance preparation. Static/Synthetic only; no live
      # filesystem mutation, no HerdrOps/Herdr process start, no release action.
      - name: 'Run v1 install-acceptance gate (Issue #44) - Static/Synthetic - PowerShell 7 (pwsh)'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $reportRoot = 'artifacts/release-gates/v1.0.0/issue-44'
          try {
            New-Item -ItemType Directory -Path $reportRoot -Force | Out-Null
            $reports = @(./tools/acceptance/Test-HerdrOpsInstallAcceptance.ps1)
            if ($reports.Count -ne 1) {
              throw "Install-acceptance gate (PowerShell 7) returned $($reports.Count) objects; expected exactly 1."
            }
            $report = $reports[0]
            if ([string]$report.EvidenceClass -cne 'Static/Synthetic') {
              throw 'Install-acceptance gate (PowerShell 7) did not return a Static/Synthetic PASS report.'
            }
            foreach ($boundary in @('CleanMachine', 'Runtime', 'Release')) {
              if ([string]$report.$boundary -cne 'NOT OBSERVED') {
                throw "Install-acceptance gate (PowerShell 7) boundary '$boundary' was not NOT OBSERVED."
              }
            }
            $report | Format-List | Out-String | Set-Content -LiteralPath (Join-Path $reportRoot 'pwsh-report.txt') -Encoding utf8
          } catch {
            $originalError = $_
            try {
              New-Item -ItemType Directory -Path $reportRoot -Force | Out-Null
              $diagPath = Join-Path $reportRoot 'pwsh-failure.txt'
              @(
                'FAILURE: Install-acceptance gate (PowerShell 7) did not complete successfully.'
                'EvidenceClass: Static/Synthetic'
                'Shell: pwsh'
                "ExitTime: $(Get-Date -Format 'o')"
                "Error: $($originalError.Exception.Message)"
                "ScriptStackTrace: $($originalError.ScriptStackTrace)"
              ) | Set-Content -LiteralPath $diagPath -Encoding utf8
            } catch {
              Write-Warning "Could not write install-acceptance gate diagnostics: $($_.Exception.Message)"
            }
            throw $originalError
          }

      # Static/Synthetic only; Actual Herdr Runtime NOT OBSERVED.
      - name: 'Run v1 install-acceptance gate (Issue #44) - Static/Synthetic - Windows PowerShell 5.1'
        if: always()
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $reportRoot = 'artifacts\release-gates\v1.0.0\issue-44'
          try {
            New-Item -ItemType Directory -Path $reportRoot -Force | Out-Null
            $reports = @(& .\tools\acceptance\Test-HerdrOpsInstallAcceptance.ps1)
            if ($reports.Count -ne 1) {
              throw "Install-acceptance gate (Windows PowerShell 5.1) returned $($reports.Count) objects; expected exactly 1."
            }
            $report = $reports[0]
            if ([string]$report.EvidenceClass -cne 'Static/Synthetic') {
              throw 'Install-acceptance gate (Windows PowerShell 5.1) did not return a Static/Synthetic PASS report.'
            }
            foreach ($boundary in @('CleanMachine', 'Runtime', 'Release')) {
              if ([string]$report.$boundary -cne 'NOT OBSERVED') {
                throw "Install-acceptance gate (Windows PowerShell 5.1) boundary '$boundary' was not NOT OBSERVED."
              }
            }
            $report | Format-List | Out-String | Set-Content -LiteralPath (Join-Path $reportRoot 'powershell-5.1-report.txt') -Encoding UTF8
          } catch {
            $originalError = $_
            try {
              New-Item -ItemType Directory -Path $reportRoot -Force | Out-Null
              $diagPath = Join-Path $reportRoot 'powershell-5.1-failure.txt'
              @(
                'FAILURE: Install-acceptance gate (Windows PowerShell 5.1) did not complete successfully.'
                'EvidenceClass: Static/Synthetic'
                'Shell: powershell (5.1)'
                "ExitTime: $(Get-Date -Format 'o')"
                "Error: $($originalError.Exception.Message)"
                "ScriptStackTrace: $($originalError.ScriptStackTrace)"
              ) | Set-Content -LiteralPath $diagPath -Encoding UTF8
            } catch {
              Write-Warning "Could not write install-acceptance gate diagnostics: $($_.Exception.Message)"
            }
            throw $originalError
          }

      - name: 'Run v1 install-acceptance durable evidence (Issue #44) - DryRun and Fixture reports'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $reportRoot = 'artifacts/release-gates/v1.0.0/issue-44'
          New-Item -ItemType Directory -Path $reportRoot -Force | Out-Null
          $dryRunReport = @(./tools/acceptance/Invoke-HerdrOpsInstallAcceptance.ps1 -Mode DryRun -ReportPath (Join-Path $reportRoot 'dry-run-report.json'))
          if ($dryRunReport.Count -ne 1 -or [string]$dryRunReport[0].status -cne 'PASS' -or [string]$dryRunReport[0].mode -cne 'DryRun' -or [string]$dryRunReport[0].evidenceClass -cne 'Static') {
            throw 'Install-acceptance DryRun evidence report did not PASS as Static evidence.'
          }
          $fixtureReport = @(./tools/acceptance/Invoke-HerdrOpsInstallAcceptance.ps1 -Mode Fixture -ReportPath (Join-Path $reportRoot 'fixture-report.json'))
          if ($fixtureReport.Count -ne 1 -or [string]$fixtureReport[0].status -cne 'PASS' -or [string]$fixtureReport[0].mode -cne 'Fixture' -or [string]$fixtureReport[0].evidenceClass -cne 'Synthetic') {
            throw 'Install-acceptance Fixture evidence report did not PASS as Synthetic evidence.'
          }
          $report = $fixtureReport[0]
          foreach ($boundary in @('contract', 'cleanMachine', 'runtime', 'independentReview', 'release')) {
            if ([string]$report.boundaries.$boundary -notlike 'NOT OBSERVED*') {
              throw "Install-acceptance Fixture evidence boundary '$boundary' was not NOT OBSERVED."
            }
          }

      - name: 'Upload v1 install-acceptance gate report (Issue #44)'
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
