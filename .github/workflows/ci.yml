      - name: Run v0.7 lifecycle implementation gate deterministic self-test (Windows PowerShell 5.1)
        shell: powershell
        run: ./tools/Test-V07Lifecycle.ps1 -SelfTest

      # Static/Synthetic policy regressions only; no live soak or Actual Herdr Runtime credit.
      - name: Run v0.7 performance budget policy tests (PowerShell 7)
        shell: pwsh
        run: ./tools/Test-V07PerformanceBudgets.Tests.ps1

      - name: Run v0.7 performance budget policy tests (Windows PowerShell 5.1)
        shell: powershell
        run: ./tools/Test-V07PerformanceBudgets.Tests.ps1

      - name: Upload test results
