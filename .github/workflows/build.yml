name: v0.6 Presentation Gates

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  evaluation-gate:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Run v0.6 Issue #31 Evaluation page gate
        shell: pwsh
        run: ./tools/Test-V06EvaluationPage.ps1 -Configuration Release

      - name: Upload v0.6 Issue #31 Evaluation gate
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: v0.6-issue-31-evaluation-gate
          path: artifacts/release-gates/v0.6.0/issue-31
          if-no-files-found: warn

      - name: Upload v0.6 Issue #31 Evaluation design evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: v0.6-issue-31-evaluation-design-evidence
          path: artifacts/design-evidence/v0.6.0/issue-31/evaluation
          if-no-files-found: warn

      - name: Upload v0.6 Issue #31 Evaluation test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: v0.6-issue-31-evaluation-test-results
          path: artifacts/test-results
          if-no-files-found: ignore

  daily-summary-gate:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      # Static/Synthetic/Contract only; Actual Herdr Runtime NOT OBSERVED.
      - name: 'Run v0.6 Daily Summary gate (Issue #32)'
        shell: pwsh
        run: ./tools/Test-V06DailySummaryPage.ps1 -Configuration Release

      - name: Upload Daily Summary gate report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: v0.6-daily-summary-gate-report
          path: artifacts/release-gates/v0.6.0/issue-32
          if-no-files-found: warn

      - name: Upload Daily Summary deterministic artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: v0.6-daily-summary-artifacts
          path: |
            artifacts/design-evidence/v0.6.0/issue-32
            artifacts/test-results
          if-no-files-found: warn
